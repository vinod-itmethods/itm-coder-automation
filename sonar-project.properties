sonar.projectKey=itm-coder-automation
sonar.projectName=ITM Coder Automation
sonar.projectVersion=1.0

# Sources
sonar.sources=src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts

# Coverage report path (adjust if your CI outputs a different path)
#sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Uncomment and set the following when running against a specific SonarQube/Cloud instance
sonar.host.url=https://sonarcloud.io
sonar.organization=itmethods-inc
# sonar.login=YOUR_TOKEN_HERE

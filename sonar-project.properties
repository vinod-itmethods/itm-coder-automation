sonar.projectKey=itm-coder-automation
sonar.projectName=ITM Coder Automation
sonar.projectVersion=1.0

# Sources
sonar.sources=src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts

# Coverage report path (adjust if your CI outputs a different path)
#sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# --- Target instance -------------------------------------------------------
# Repointed from SonarCloud to the staging SonarQube *Server* for the PR
# decoration experiments (see EXPERIMENTS.md). The token is NOT stored here;
# it is passed at runtime via the SONAR_TOKEN env var (CI secret or local env).
sonar.host.url=https://itmethods-stage.devopsx.io

# Original SonarCloud binding (kept for reference; not used by these tests):
# sonar.host.url=https://sonarcloud.io
# sonar.organization=itmethods-inc
